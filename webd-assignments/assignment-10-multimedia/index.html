<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia</title>
</head>
<body>
  <h3>Image</h3>
  <img src="images/campus.png" alt="College campus" width="200" height="200">

  <h3>Video</h3>
  <video controls width="260">
    <source src="media/sample.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h3>Audio</h3>
  <audio controls>
    <source src="media/sample.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>

  <h3>YouTube</h3>
  <!-- Replace the video ID after /embed/ with the video you want to show -->
  <iframe width="420" height="315"
          src="https://www.youtube.com/embed/M7lc1UVf-VE"
          title="YouTube video player"
          allowfullscreen></iframe>
</body>
</html>
