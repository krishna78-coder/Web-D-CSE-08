<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Layout</title>
</head>
<body>
  <header>
    <h1>College Portal</h1>
  </header>

  <nav>
    <a href="#">Home</a> |
    <a href="#">Courses</a>
  </nav>

  <main>
    <section>
      <h2>Admission Open</h2>
      <p>Apply before 30 June.</p>
    </section>
    <aside>
      <p>Notice: Library closed Sunday.</p>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 College</p>
  </footer>

  <!--
    Non-semantic (div) version of the same layout, for comparison:

    <div id="header"><h1>College Portal</h1></div>
    <div id="nav"><a href="#">Home</a> | <a href="#">Courses</a></div>
    <div id="main">
      <div class="section"><h2>Admission Open</h2><p>Apply before 30 June.</p></div>
      <div class="aside"><p>Notice: Library closed Sunday.</p></div>
    </div>
    <div id="footer"><p>&copy; 2026 College</p></div>

    Divs say nothing about their purpose; header, nav, main, section, aside and
    footer describe it, which helps screen readers and search engines.
  -->
</body>
</html>
