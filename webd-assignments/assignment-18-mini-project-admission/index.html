<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
    body {
      margin: 0;
    }
    header, footer {
      background: #1a237e;
      color: white;
      text-align: center;
      padding: 20px;
    }
    footer {
      padding: 10px;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 10px 0 20px;
    }
    .skip-link {
      position: absolute;
      left: -999px;
    }
    .skip-link:focus {
      left: 8px;
      top: 8px;
      background: white;
      padding: 4px 8px;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 6px 8px;
      text-align: left;
    }
    th {
      background: #e8eaf6;
      text-align: center;
    }
    form p {
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main id="main">
    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>
      <div class="table-wrap">
        <table>
          <caption>Available Courses</caption>
          <thead>
            <tr>
              <th scope="col">Course</th>
              <th scope="col">Seats</th>
              <th scope="col">Fees</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>B.Tech CSE</td>
              <td>120</td>
              <td>&#8377;90,000</td>
            </tr>
            <tr>
              <td>BCA</td>
              <td>60</td>
              <td>&#8377;45,000</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="apply-heading">
      <h2 id="apply-heading" style="position:absolute; left:-999px;">Application</h2>
      <form action="submit.php" method="post">
        <fieldset>
          <legend>Application Form</legend>

          <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
          </p>

          <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="course">Course:</label><br>
            <select id="course" name="course">
              <option>B.Tech CSE</option>
              <option>BCA</option>
            </select>
          </p>

          <p>
            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="4" cols="50"></textarea>
          </p>

          <p>
            <button type="submit">Apply</button>
          </p>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p style="margin:0;">&copy; 2026 ABC College</p>
  </footer>
</body>
</html>
