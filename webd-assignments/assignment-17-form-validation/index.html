<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
</head>
<body>
  <form action="submit.php" method="post">
    <p>
      <input type="text" name="fullname" placeholder="Full name" required>
    </p>

    <p>
      <input type="email" name="email" placeholder="you@college.edu" required>
    </p>

    <p>
      <input type="text" name="mobile" placeholder="10-digit mobile"
             pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
    </p>

    <p>
      <input type="password" name="password" placeholder="Min 6 characters"
             minlength="6" required>
    </p>

    <p>
      <input type="number" name="age" placeholder="Age (17-30)" min="17" max="30" required>
    </p>

    <p>
      <button type="submit">Register</button>
    </p>
  </form>
</body>
</html>
